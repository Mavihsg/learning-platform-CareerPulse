# =========================================================================
# Production Profile: Cloud PostgreSQL Database (Neon.tech)
# =========================================================================

# Server Port (Cloud platforms like Railway & Render inject PORT env var)
server.port=${PORT:8080}

# Neon.tech PostgreSQL Datasource Connection (Using PgBouncer Connection Pooler)
spring.datasource.url=${SPRING_DATASOURCE_URL:}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:neondb_owner}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Compression
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/css,application/javascript
server.compression.min-response-size=1024

# Hibernate / JPA Configuration for PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.default_batch_fetch_size=25
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.open-in-view=false

# Spring In-Memory Cache (Sub-millisecond API responses)
spring.cache.type=simple
spring.cache.cache-names=courses,course,dashboard,team_analytics,enrolled_courses,users,all_users,weekly_activity,leaderboard

# HikariCP Connection Pool Optimized for Neon Serverless Postgres
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.keepalive-time=30000

# Security: Disable H2 in-memory console in production
spring.h2.console.enabled=false
