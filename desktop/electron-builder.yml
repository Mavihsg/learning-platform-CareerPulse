appId: com.careerpulse.desktop
productName: CareerPulse
copyright: "Copyright © 2026 CareerPulse Engineering"
directories:
  output: dist

publish: null

files:
  - "src/**/*"
  - "package.json"

win:
  target:
    - nsis
  artifactName: "${productName}-Setup-${version}.${ext}"

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: "CareerPulse"

mac:
  target:
    - dmg
    - zip
  category: public.app-category.education
  artifactName: "${productName}-${version}-${arch}.${ext}"

linux:
  target:
    - AppImage
    - deb
  category: Education
  artifactName: "${productName}-${version}.${ext}"
