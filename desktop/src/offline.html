<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareerPulse Desktop - Connection Lost</title>
    <style>
        :root {
            --bg-app: #090B10;
            --bg-surface: #11141D;
            --border-color: #1F2536;
            --brand-primary: #2563EB;
            --brand-primary-hover: #1D4ED8;
            --text-primary: #F8FAFC;
            --text-secondary: #94A3B8;
            --text-muted: #64748B;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-app);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            user-select: none;
        }

        .offline-container {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 3rem 2.5rem;
            max-width: 480px;
            width: 90%;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .pulse-icon-wrapper {
            position: relative;
            width: 80px;
            height: 80px;
            margin: 0 auto 1.5rem auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .pulse-ring {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 2px solid rgba(37, 99, 235, 0.4);
            animation: pulseRing 2.2s infinite cubic-bezier(0.215, 0.61, 0.355, 1);
        }

        .pulse-ring:nth-child(2) {
            animation-delay: 0.6s;
        }

        @keyframes pulseRing {
            0% { transform: scale(0.6); opacity: 0.8; }
            100% { transform: scale(1.6); opacity: 0; }
        }

        .icon-circle {
            width: 58px;
            height: 58px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(37, 99, 235, 0.2) 0%, rgba(124, 58, 237, 0.2) 100%);
            border: 1px solid rgba(37, 99, 235, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.75rem;
            z-index: 2;
        }

        .brand-badge {
            display: inline-block;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            color: var(--brand-primary);
            text-transform: uppercase;
            margin-bottom: 0.75rem;
        }

        .offline-title {
            font-size: 1.45rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
        }

        .offline-desc {
            font-size: 0.88rem;
            color: var(--text-secondary);
            line-height: 1.5;
            margin-bottom: 1.75rem;
        }

        .offline-url-pill {
            display: inline-block;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 0.3rem 0.75rem;
            font-size: 0.78rem;
            color: var(--text-muted);
            font-family: monospace;
            margin-bottom: 1.5rem;
            word-break: break-all;
        }

        .btn-retry {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            background: var(--brand-primary);
            color: #FFFFFF;
            border: none;
            border-radius: 6px;
            padding: 0.75rem 1.75rem;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
        }

        .btn-retry:hover {
            background: var(--brand-primary-hover);
            transform: translateY(-1px);
        }

        .btn-retry:active {
            transform: translateY(0);
        }

        .auto-retry-text {
            margin-top: 1rem;
            font-size: 0.75rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>
    <div class="offline-container">
        <div class="pulse-icon-wrapper">
            <div class="pulse-ring"></div>
            <div class="pulse-ring"></div>
            <div class="icon-circle">⚡</div>
        </div>

        <span class="brand-badge">CAREER PULSE DESKTOP</span>
        <h1 class="offline-title">Server Unavailable</h1>
        <p class="offline-desc">Unable to reach the CareerPulse application service. Please ensure the backend server is running or check your network connection.</p>
        
        <div class="offline-url-pill" id="target-url">http://localhost:8080</div>

        <button class="btn-retry" id="btn-retry" onclick="retryConnection()">
            <span id="btn-text">Retry Connection</span>
        </button>

        <div class="auto-retry-text" id="auto-retry-msg">Auto-retrying in <span id="countdown">5</span>s...</div>
    </div>

    <script>
        let countdown = 5;
        let countdownInterval;

        function startCountdown() {
            clearInterval(countdownInterval);
            countdown = 5;
            document.getElementById('countdown').textContent = countdown;
            
            countdownInterval = setInterval(() => {
                countdown--;
                document.getElementById('countdown').textContent = countdown;
                if (countdown <= 0) {
                    clearInterval(countdownInterval);
                    retryConnection();
                }
            }, 1000);
        }

        function retryConnection() {
            document.getElementById('btn-text').textContent = 'Connecting...';
            window.location.reload();
        }

        // Display current target URL
        const params = new URLSearchParams(window.location.search);
        const urlParam = params.get('url');
        if (urlParam) {
            document.getElementById('target-url').textContent = decodeURIComponent(urlParam);
        }

        startCountdown();
    </script>
</body>
</html>
