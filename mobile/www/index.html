<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>CareerPulse Mobile</title>
    <style>
        body {
            background-color: #090B10;
            color: #F8FAFC;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 1.5rem;
            text-align: center;
        }
        .logo-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }
        p {
            color: #94A3B8;
            font-size: 0.9rem;
            max-width: 320px;
            line-height: 1.5;
            margin-bottom: 1.5rem;
        }
        .btn-reload {
            background: #2563EB;
            color: #FFF;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="logo-icon">⚡</div>
    <h1>Connecting to CareerPulse</h1>
    <p>Loading the latest learning materials and personalized career benchmark tracks...</p>
    <button class="btn-reload" onclick="window.location.reload()">Retry Connection</button>
</body>
</html>
